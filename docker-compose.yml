services:
  # N3N Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: n3n-app
    ports:
      - "${N3N_PORT:-8080}:8080"
    environment:
      # Database
      DATABASE_URL: jdbc:postgresql://postgres:5432/n3n
      DATABASE_USERNAME: n3n
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-n3n}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # JWT Secret 自動產生，無需設定
      # 如需叢集部署共用同一密鑰，可設定：JWT_SECRET=<base64 encoded 32-byte key>
      # CORS
      ALLOWED_ORIGINS: http://localhost:${N3N_PORT:-8080},http://localhost:8080,http://localhost:3000
      # Flow Optimizer
      FLOW_OPTIMIZER_ENABLED: "true"
      FLOW_OPTIMIZER_URL: http://flow-optimizer:8081
    volumes:
      - app_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: n3n-postgres
    environment:
      POSTGRES_DB: n3n
      POSTGRES_USER: n3n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n3n}
    # Internal service — no ports exposed by default.
    # For development access, uncomment below or use: docker compose exec postgres psql -U n3n
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n3n"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: n3n-redis
    # Internal service — no ports exposed by default.
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      sh -c 'redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    restart: unless-stopped

  # MongoDB for workflow nodes that require NoSQL storage
  mongodb:
    image: mongo:7
    container_name: n3n-mongodb
    # Internal service — no ports exposed by default.
    # ports:
    #   - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-n3n_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-n3n_dev_only}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-n3n_test}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    restart: unless-stopped

  # Flow Optimizer Service (Local AI - Phi-3-Mini for flow optimization)
  # Enabled by default - provides AI flow optimization without external API keys
  flow-optimizer:
    build:
      context: ./flow-optimizer
      dockerfile: Dockerfile
    container_name: n3n-flow-optimizer
    # Internal service — no ports exposed by default.
    # ports:
    #   - "8081:8081"
    environment:
      LLAMAFILE_HOST: "0.0.0.0"
      LLAMAFILE_PORT: "8081"
      LLAMAFILE_THREADS: "4"
      LLAMAFILE_CTX_SIZE: "4096"
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    restart: unless-stopped

volumes:
  app_data:
  postgres_data:
  redis_data:
  mongodb_data:
