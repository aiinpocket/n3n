services:
  # N3N Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: n3n-app
    ports:
      - "${N3N_PORT:-8080}:8080"
    environment:
      # Database
      DATABASE_URL: jdbc:postgresql://postgres:5432/n3n
      DATABASE_USERNAME: n3n
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-n3n}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # JWT Secret 自動產生，無需設定
      # 如需叢集部署共用同一密鑰，可設定：JWT_SECRET=<base64 encoded 32-byte key>
      # CORS（生產環境請在 .env 中設定你的域名）
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:${N3N_PORT:-8080},http://localhost:8080,http://localhost:3000}
      # Artifacts（節點產出檔案儲存）
      ARTIFACT_STORAGE_PATH: /app/data/artifacts
      # 站台子網域託管（空值 = 休眠，僅路徑式 /sites/{slug}/；搭配 caddy profile 使用）
      SITE_BASE_DOMAIN: ${SITE_BASE_DOMAIN:-}
    volumes:
      - app_data:/data
      - n3n_artifacts:/app/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    restart: unless-stopped

  # Caddy 反向代理（網域模式專用；預設本機部署不受影響）
  # 啟用：docker compose --profile domain up -d
  # 需在 .env 設定 SITE_MAIN_DOMAIN 與 SITE_BASE_DOMAIN，DNS 建立
  # *.{SITE_BASE_DOMAIN} wildcard A 記錄指向主機 IP。
  caddy:
    image: caddy:2-alpine
    container_name: n3n-caddy
    profiles: ["domain"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      # domain profile 啟用時兩者皆必填（compose 對未啟用的 profile 也會插值，
      # 故此處用預設空值而非 :? 硬性檢查，避免影響預設本機部署）
      SITE_MAIN_DOMAIN: ${SITE_MAIN_DOMAIN:-}
      SITE_BASE_DOMAIN: ${SITE_BASE_DOMAIN:-}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: n3n-postgres
    environment:
      POSTGRES_DB: n3n
      POSTGRES_USER: n3n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n3n}
    # Internal service — no ports exposed by default.
    # For development access, uncomment below or use: docker compose exec postgres psql -U n3n
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n3n"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: n3n-redis
    # Internal service — no ports exposed by default.
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      sh -c 'redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    restart: unless-stopped

  # MongoDB for workflow nodes that require NoSQL storage
  mongodb:
    image: mongo:7
    container_name: n3n-mongodb
    # Internal service — no ports exposed by default.
    # ports:
    #   - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-n3n_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-n3n_dev_only}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-n3n_test}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  app_data:
  n3n_artifacts:
  postgres_data:
  redis_data:
  mongodb_data:
