# =============================================================
# N3N Flow Platform - Production Values (kubeinpocket.com)
# =============================================================
# 部署到 TaipeiCenter K8s 叢集
# Domain: https://n3n.kubeinpocket.com
# Docker Registry: ghcr.io
# Storage: NFS (nfs-client StorageClass)
# TLS: Cloudflare Origin Certificate (自動)
# =============================================================

replicaCount: 1

image:
  repository: ghcr.io/aiinpocket/n3n
  pullPolicy: Always
  tag: "f92d3df"

imagePullSecrets:
  - name: ghcr-secret
fullnameOverride: "n3n"

serviceAccount:
  create: true
  annotations: {}

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/actuator/prometheus"

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080

# =============================================================
# Ingress - n3n.kubeinpocket.com
# =============================================================
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "N3N_AFFINITY"
    nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
    nginx.ingress.kubernetes.io/session-cookie-path: "/"
  hosts:
    - host: n3n.kubeinpocket.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# =============================================================
# Resources
# =============================================================
resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

# =============================================================
# Autoscaling - n3n app (min 1, max 3)
# =============================================================
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# =============================================================
# Application Configuration
# =============================================================
config:
  jwtSecret: ""
  encryptionKey: ""
  allowedOrigins: "https://n3n.kubeinpocket.com"
  logLevel: INFO
  executionRetentionDays: 30
  executionMaxConcurrent: 100
  executionTimeoutMs: 300000
  orchestratorType: docker
  ddlAuto: validate
  swaggerEnabled: "false"

# =============================================================
# Persistence - Data volume (/data)
# =============================================================
persistence:
  enabled: true
  storageClass: "nfs-client"
  size: 1Gi
  accessMode: ReadWriteMany

# =============================================================
# Database - Standalone PostgreSQL Deployment
# =============================================================
database:
  external: true
  host: "n3n-postgres"
  port: 5432
  name: n3n
  username: n3n
  password: ""
  poolSize: 20
  minIdle: 5
  storageClass: "nfs-client"
  storageSize: 20Gi

# Disable bitnami subchart
postgresql:
  enabled: false

# =============================================================
# Redis - Standalone Redis Deployment
# =============================================================
redis:
  external: true
  host: "n3n-redis"
  port: 6379
  password: ""
  enabled: false
  storageClass: "nfs-client"
  storageSize: 2Gi

# =============================================================
# Health Checks
# =============================================================
healthCheck:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 90
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 45
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# =============================================================
# Monitoring
# =============================================================
monitoring:
  enabled: true
  serviceMonitor:
    enabled: false
    interval: 30s
    path: /actuator/prometheus
