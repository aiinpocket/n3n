# Default values for n3n
replicaCount: 2

image:
  repository: n3n/flow-platform
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Enable WebSocket support
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$request_uri"
  hosts:
    - host: n3n.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Persistence for /data (master key, etc.)
persistence:
  enabled: false
  storageClass: ""
  size: 1Gi
  accessMode: ReadWriteMany

# Application configuration
config:
  # JWT secret - auto-generated if not set
  # IMPORTANT: For multi-replica deployments, set this explicitly so all pods share the same secret
  jwtSecret: ""
  # Master encryption key for AES-256-GCM credential encryption (maps to N3N_MASTER_KEY env var)
  # IMPORTANT: For multi-replica deployments, ALL pods MUST share the same key.
  # If left empty, each pod auto-generates its own key and credentials encrypted by one pod
  # cannot be decrypted by another. Generate with: openssl rand -base64 32
  encryptionKey: ""
  # Allowed CORS origins (comma-separated)
  allowedOrigins: "https://n3n.local"
  # Log level
  logLevel: INFO
  # Execution settings
  executionRetentionDays: 30
  executionMaxConcurrent: 100
  executionTimeoutMs: 300000
  # Container orchestration type: docker, kubernetes, auto
  orchestratorType: docker
  # JPA DDL auto mode: update, validate, create, create-drop
  ddlAuto: update
  # Swagger/OpenAPI UI
  swaggerEnabled: "false"

# Flow Optimizer (local Phi-3-Mini LLM for flow analysis)
flowOptimizer:
  enabled: true
  url: "http://n3n-flow-optimizer:8081"  # Use K8s Service name; override with localhost:8081 for local dev
  timeoutMs: 30000

# Database configuration
database:
  # Use external database or built-in PostgreSQL
  external: false
  host: ""
  port: 5432
  name: n3n
  username: n3n
  password: ""
  # Connection pool settings
  poolSize: 10
  minIdle: 2

# Redis configuration
# To use external Redis: set external=true and configure host/port/password.
# To use built-in Redis: set enabled=true (default).
redis:
  external: false
  host: ""
  port: 6379
  password: ""
  # Built-in Redis (Bitnami subchart) settings
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 1Gi

# Built-in PostgreSQL (Bitnami chart)
postgresql:
  enabled: true
  auth:
    username: n3n
    password: n3n-dev-only  # DEV ONLY — override via --set postgresql.auth.password=xxx in production
    database: n3n
  primary:
    persistence:
      enabled: true
      size: 10Gi

# Health checks
healthCheck:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Monitoring
monitoring:
  enabled: true
  serviceMonitor:
    enabled: false
    interval: 30s
    path: /actuator/prometheus
