# 小應用（Hosted Apps）覆蓋檔 —— 讓使用者上傳的 docker-compose / Dockerfile
# 專案以沙盒容器跑在平台旁邊，並由平台反向代理到 {slug}.{SITE_BASE_DOMAIN}。
#
# 使用方式（網路要先建立，見下方說明）：
#   docker network create n3n-apps
#   docker compose -f docker-compose.yml -f docker-compose.apps.yml up -d
#   （需要網域模式時再加 --profile domain）
#
# 為什麼要先 `docker network create n3n-apps`：
#   DockerContainerRuntime 會在「部署第一個應用」時自動建立這個網路，
#   但 compose 啟動 app 服務時就要把它接上 external network——
#   順序上網路必須先於 compose up 存在，所以請先手動建立一次即可。
#
# 注意 — 安全性說明（掛載 docker.sock 的代價）：
#   掛載 /var/run/docker.sock 等同賦予 n3n-app 容器對主機 Docker 的
#   完全控制權（root-equivalent）。這是小應用功能運作的必要條件，
#   平台端已以功能旗標（預設關閉）、每人數量上限、容器硬化
#   （cap-drop ALL、no-new-privileges、記憶體/CPU/pids 上限、專用 bridge
#   network、禁止 bind mount）緩解，但仍請只在信任平台使用者的環境啟用。

services:
  app:
    environment:
      # 預設關閉；用這個覆蓋檔啟動時明確開啟（也可在 .env 設 APPS_ENABLED）
      APPS_ENABLED: ${APPS_ENABLED:-true}
      # 子網域反向代理走容器 DNS（n3napp-{slug}-{service}:{internalPort}）
      APPS_PROXY_TARGET: ${APPS_PROXY_TARGET:-container}
    volumes:
      # 見上方安全性說明
      - /var/run/docker.sock:/var/run/docker.sock
    # app 容器以非 root（uid 1000）執行，需要 docker.sock 的群組讀寫權。
    # sock 的群組因發行版而異：多為 root:root(0)，Ubuntu 上常是 docker 群組
    # （查法：stat -c %g /var/run/docker.sock），不同時在 .env 設 DOCKER_SOCK_GID。
    group_add:
      - "0"
      - "${DOCKER_SOCK_GID:-0}"
    networks:
      # default 保留原有平台網路；n3n-apps 讓 app 容器能以 DNS 名稱
      # 直接連到小應用的 web 容器（反向代理目標）
      - default
      - n3n-apps

networks:
  n3n-apps:
    external: true
